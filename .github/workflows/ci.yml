name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [18, 20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity (verify tests create throwaway repos)
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      - name: Run test suite
        run: ./test/run.sh
      - name: Run bench
        run: node bench/run.js
      - name: Lint the bundled example
        run: node bin/handover-lint.js examples/handover.example.md --min=95
